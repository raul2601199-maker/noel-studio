<section class="contacto" id="contacto" data-mundo="lectura">
  <div class="contenedor contacto__rejilla">
    <div>
      <h2 data-aparece>Cuéntame de tu negocio.</h2>
      <ul class="contacto__datos">
        <li>{{ICONO:message-circle}}<a href="{{WA}}">WhatsApp · {{TEL}}</a></li>
        <li>{{ICONO:mail}}<a href="mailto:{{CORREO}}">{{CORREO}}</a></li>
        <li>{{ICONO:map-pin}}<span>Chihuahua, México · Atiendo todo México</span></li>
      </ul>
    </div>
    <form class="formulario" data-formulario data-whatsapp="{{WA}}">
      <label>Tu nombre<input name="nombre" autocomplete="name" required></label>
      <label>Tu negocio<input name="negocio" autocomplete="organization" required></label>
      <label>¿Qué necesitas?<textarea name="mensaje" rows="3" required></textarea></label>
      <button class="btn btn--solido" type="submit">Enviar por WhatsApp</button>
    </form>
  </div>
</section>
